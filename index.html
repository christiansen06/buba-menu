<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BüBa — Bubble Tea, Café y Waffles · Mar del Plata</title>
    <meta
      name="description"
      content="Menú digital de BüBa: bubble tea, café, licuados, waffles y helados. Armá tu pedido y mandalo por WhatsApp. Bolívar 2120, Mar del Plata."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#4CE5EB" />

    <!--
      Cómo se ve el link cuando alguien lo comparte por WhatsApp, Instagram
      o Facebook. og:image tiene que ser una URL absoluta y vivir en /public
      (los archivos de src/assets cambian de nombre en cada build).
      Si algún día cambia el dominio, hay que actualizar las tres URLs de acá.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BüBa" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="BüBa — Bubble Tea, Café y Waffles" />
    <meta
      property="og:description"
      content="Armá tu pedido desde el celular y mandalo por WhatsApp. Bolívar 2120, Mar del Plata."
    />
    <meta property="og:url" content="https://buba-mdq.vercel.app/" />
    <meta property="og:image" content="https://buba-mdq.vercel.app/og-buba.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de BüBa — Bubble Tea, Café y Waffles" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BüBa — Bubble Tea, Café y Waffles" />
    <meta
      name="twitter:description"
      content="Armá tu pedido desde el celular y mandalo por WhatsApp. Bolívar 2120, Mar del Plata."
    />
    <meta name="twitter:image" content="https://buba-mdq.vercel.app/og-buba.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
